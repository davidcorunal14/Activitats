<!DOCTYPE html> 
<html lang="ca">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Grid</title>
        <title>Exercicis lleguantges de marques</title>
        <meta name="description" content="Recull d'exercicis">
        <meta name="author" content="David">
        <link rel="stylesheet" href="../css/karma.css">
    </head>
    <body>
        <header class="header">
            <a href="#" class="header__logo">
                <img src="../img/karma-logo.svg" alt="Karma">
            </a>
            
            <button class="header__menu" type="button" aria-label="Open menu">
                <img src="../img/menu-hamburger.svg" alt="">
            </button>

            <nav class="header__nav">
                <ul class="nav__list">
                    <li><a href="#" class="nav__link">Meet Karma</a></li>
                    <li><a href="#" class="nav__link">How it Works</a></li>
                    <li><a href="#" class="nav__link nav__link--active">Store</a></li>
                    <li><a href="#" class="nav__link">Blog</a></li>
                    <li><a href="#" class="nav__link">Help</a></li>
                    <li><a href="#" class="nav__link">Login</a></li>
                </ul>
            </nav>
        </header>
 
        <main>
            <section class="hero">
                <h1 class="hero__title">Introducing Karma</h1>
                <p class="hero__text">Bring WiFi with you, everywhere you go.</p>
                <a href="#" class="button">Learn More</a>
            </section>
 
            <section class="features">
                <h2 class="features__title">Everyone needs a little Karma.</h2>
 
                <article class="feature">
                    <img class="feature__icon" src="../img/icon-devices.svg" alt="">
                    <h3 class="feature__text">Internet for all devices</h3>
                </article>
 
                <article class="feature">
                    <img class="feature__icon" src="../img/icon-coffee.svg" alt="">
                    <h3 class="feature__text">Boost your productivity</h3>
                </article>
 
                <article class="feature">
                    <img class="feature__icon" src="../img/icon-refill.svg" alt="">
                    <h3 class="feature__text">Pay as You Go</h3>
                </article>
            </section>
        </main>
 
        <footer class="footer">
            <p class="footer__title">Join us on</p>
            <ul class="social">
                <li>
                    <a href="#" class="social__link">
                        <img src="../img/twitter-icon.svg" alt="Twitter">
                    </a>
                </li>
                <li>
                    <a href="#" class="social__link">
                        <img src="../img/facebook-icon.svg" alt="Facebook">
                    </a>
                </li>
                <li>
                    <a href="#" class="social__link">
                        <img src="../img/instagram-icon.svg" alt="Instagram">
                    </a>
                </li>
            </ul>

        </footer>
